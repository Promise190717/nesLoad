<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>模型诊断2-复刻变换链</title></head>
<body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.187.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x334455);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 1.6, 3);
camera.lookAt(0, 0.9, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.MeshStandardMaterial({color:0x888888}));
ground.rotation.x = -Math.PI/2; scene.add(ground);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.5));
const dir = new THREE.DirectionalLight(0xffffff,2); dir.position.set(5,8,3); dir.castShadow=true; scene.add(dir);
scene.add(new THREE.AmbientLight(0xffffff,0.6));

const loader = new GLTFLoader();
loader.load('/models/soldier.glb', (gltf) => {
  const source = gltf.scene;
  source.rotation.y = Math.PI;
  const b0 = new THREE.Box3().setFromObject(source);
  source.position.y -= b0.min.y;

  // 完整复刻游戏 CharacterRig 变换链
  const ACTOR_HEIGHT = 1.72;
  const root = new THREE.Group();
  const tilt = new THREE.Group();
  const body = new THREE.Group();
  root.add(tilt); tilt.add(body);

  const model = source.clone(true);
  body.add(model);
  const height = (() => { const b = new THREE.Box3().setFromObject(model); return b.max.y - b.min.y; })();
  body.scale.setScalar(ACTOR_HEIGHT / height);
  console.log('[复刻] height=', height, 'body.scale=', body.scale.x);

  // 模拟 update：actor 在 (0,0,0)，yaw=0
  root.position.set(0, 0, 0);
  root.rotation.y = -0 - Math.PI/2;

  model.traverse(o => { if (o.isMesh) { o.frustumCulled = false; o.castShadow = true; } });
  scene.add(root);

  const bf = new THREE.Box3().setFromObject(root);
  console.log('[复刻] 最终 root bbox min', bf.min.toArray(), 'max', bf.max.toArray(), '高度', (bf.max.y-bf.min.y).toFixed(3));

  // 播放 Idle
  const mixer = new THREE.AnimationMixer(model);
  const clip = gltf.animations.find(a=>a.name==='Idle')||gltf.animations[0];
  mixer.clipAction(clip).play();
  const clock = new THREE.Clock();
  function anim(){ requestAnimationFrame(anim); mixer.update(clock.getDelta()); renderer.render(scene,camera); }
  anim();
}, undefined, (e)=>console.error(e));
</script>
</body>
</html>
